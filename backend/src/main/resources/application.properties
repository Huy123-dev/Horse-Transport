server.port=8080

# ===== SQL Server (HorseTransportManagementDB) - điền mật khẩu sa vào DB_PASSWORD =====
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=HorseTransportManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===== JWT (secret là chuỗi Base64, tối thiểu 32 byte; đổi trước khi deploy) =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===== role_id gán cho tài khoản mới đăng ký (phải tồn tại trong bảng roles) =====
app.default-role-id=CUSTOMER

# ===== CORS (React/Vite frontend) =====
app.cors.allowed-origins=http://localhost:3000

# ===== Password reset email (set SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM and APP_PUBLIC_URL) =====
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${SMTP_USER:}}
spring.mail.password=${SMTP_PASSWORD:${SMTP_PASS:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.password-reset.frontend-url=${APP_PUBLIC_URL:http://localhost:3000}
app.password-reset.mail-from=${SMTP_FROM:${SMTP_USERNAME:${SMTP_USER:no-reply@equideli.com}}}

# ===== Upload hồ sơ ngựa (file lưu trên ổ đĩa máy chủ; đổi UPLOAD_DIR để trỏ sang thư mục khác) =====
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:12MB}
