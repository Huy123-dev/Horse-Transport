server.port=8080

# ===== SQL Server (HorseTransportManagementDB) - điền mật khẩu sa vào DB_PASSWORD =====
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=HorseTransportManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ===== JWT (secret là chuỗi Base64, tối thiểu 32 byte; đổi trước khi deploy) =====
jwt.secret=${JWT_SECRET:ZXF1aWZsb3ctZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24hIQ==}
jwt.expiration-ms=86400000


# ===== role_id gán cho tài khoản mới đăng ký (phải tồn tại trong bảng roles) =====
app.default-role-id=CUSTOMER

# ===== CORS (Next.js) =====
app.cors.allowed-origins=http://localhost:3000

# ===== Upload hồ sơ ngựa (file lưu trên ổ đĩa máy chủ; đổi UPLOAD_DIR để trỏ sang thư mục khác) =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB