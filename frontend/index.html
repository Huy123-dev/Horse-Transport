<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EQUIDELI — Nền tảng quản lý vận chuyển ngựa đua quốc tế: tạo yêu cầu, thẩm định hồ sơ pháp lý, lập kế hoạch lộ trình và theo dõi hành trình."
    />
    <meta name="theme-color" content="#F7F3EB" />
    <title>EQUIDELI — Quản lý vận chuyển ngựa đua</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("equideli-theme");
          if (
            theme === "dark" ||
            (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Theme initialization is optional when browser storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
